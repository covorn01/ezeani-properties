<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A021E"/>
      <stop offset="50%" stop-color="#2D0637"/>
      <stop offset="100%" stop-color="#120115"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8DC63F" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7A2FB0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A021E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B125B"/>
      <stop offset="60%" stop-color="#2B0735"/>
      <stop offset="100%" stop-color="#190220"/>
    </linearGradient>
    <linearGradient id="suitHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B462E8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7A2FB0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8DC63F" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A2FB0"/>
      <stop offset="100%" stop-color="#34073E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="url(#glowGrad)"/>

  <!-- Monogram Background Watermark -->
  <text x="400" y="520" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="280" font-weight="900" fill="#7A2FB0" opacity="0.08" letter-spacing="10">CE</text>

  <!-- Geometric Luxury Pattern Accents -->
  <circle cx="400" cy="380" r="260" fill="none" stroke="#7A2FB0" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25"/>
  <circle cx="400" cy="380" r="290" fill="none" stroke="#8DC63F" stroke-width="1" opacity="0.2"/>

  <!-- Executive Silhouette Body -->
  <g filter="url(#subtleShadow)">
    <!-- Shoulders & Suit Torso -->
    <path d="M 160 880 C 160 740, 240 640, 310 600 L 350 560 L 450 560 L 490 600 C 560 640, 640 740, 640 880 L 160 880 Z" fill="url(#silhouetteGrad)" stroke="url(#suitHighlight)" stroke-width="2"/>
    
    <!-- Suit Lapels Left & Right -->
    <path d="M 350 560 L 375 740 L 400 780 L 340 670 Z" fill="#3D0948" stroke="#B462E8" stroke-width="1.5" opacity="0.8"/>
    <path d="M 450 560 L 425 740 L 400 780 L 460 670 Z" fill="#3D0948" stroke="#B462E8" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Shirt Collar (V-Neck) -->
    <polygon points="375,560 425,560 400,660" fill="#FAF7FC" opacity="0.85"/>

    <!-- Silk Tie with Gold/Lime Pin -->
    <polygon points="392,600 408,600 414,750 400,790 386,750" fill="url(#tieGrad)" stroke="#B462E8" stroke-width="1"/>
    <circle cx="400" cy="670" r="3.5" fill="#8DC63F"/>

    <!-- Neck -->
    <rect x="365" y="470" width="70" height="100" rx="20" fill="url(#silhouetteGrad)" stroke="#7A2FB0" stroke-width="1.5"/>

    <!-- Head / Jaw Silhouette -->
    <ellipse cx="400" cy="380" rx="115" ry="145" fill="url(#silhouetteGrad)" stroke="url(#suitHighlight)" stroke-width="2"/>
    <!-- Groomed Hair Contour -->
    <path d="M 285 370 C 285 240, 340 220, 400 220 C 460 220, 515 240, 515 370 C 515 310, 470 250, 400 250 C 330 250, 285 310, 285 370 Z" fill="#24032C"/>
  </g>

  <!-- Top Badge Overlay: Founder Mandate -->
  <g transform="translate(400, 80)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#1E0424" fill-opacity="0.85" stroke="#7A2FB0" stroke-width="1.5"/>
    <circle cx="-95" cy="0" r="5" fill="#8DC63F"/>
    <text x="-75" y="5" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#8DC63F" letter-spacing="2">FOUNDER &amp; MD</text>
  </g>

  <!-- Bottom Elegant Title Plaque -->
  <g transform="translate(0, 860)">
    <!-- Frosted Plaque Background -->
    <rect x="50" y="0" width="700" height="105" rx="24" fill="#16021B" fill-opacity="0.9" stroke="#7A2FB0" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="50" y="0" width="700" height="3" fill="#8DC63F"/>
    
    <!-- Title & Subtitle -->
    <text x="400" y="42" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#FFFFFF" letter-spacing="1">CHRISTIAN EZEANI</text>
    <text x="400" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#B462E8" letter-spacing="2">CEO / FOUNDER • EZEANI GROUP</text>
    <text x="400" y="92" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="normal" fill="#8DC63F" opacity="0.9">OFFICIAL CORPORATE PORTRAIT IN PRODUCTION</text>
  </g>
</svg>
